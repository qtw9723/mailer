name: chatbot-check
on:
  # 정시 트리거는 Supabase pg_cron(chatbot-check-dispatch, 23:30 UTC = 08:30 KST)이
  # /api/chatbot/dispatch를 호출해 workflow_dispatch로 일으킨다.
  # GitHub on:schedule은 best-effort라 매일 ~2h씩 밀려(실측 10~11시 KST) 제거함.
  workflow_dispatch:
    inputs:
      bot_id:
        description: '특정 봇만 체크 (chatbots.id, 비우면 전체)'
        required: false
        type: string
      category:
        description: '특정 카테고리만 체크 (__none__ = 미분류, 비우면 전체)'
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: node scripts/chatbot-check.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_ID: ${{ inputs.bot_id }}
          CATEGORY: ${{ inputs.category }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
